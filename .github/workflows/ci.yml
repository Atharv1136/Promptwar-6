name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Coverage & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Code Formatting Check
        run: npm run format:check

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Execute Vitest Test Suites with Coverage Gates
        run: npm run test:coverage

      - name: Production Bundle Compilation
        run: npm run build
